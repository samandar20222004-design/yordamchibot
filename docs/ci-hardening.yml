# ============================================================================
# ⚠️ KO'CHIRISH KERAK: bu fayl .github/workflows/ci.yml ning yangi versiyasi.
# GitHub App tokeni workflow faylini push qila olmadi ("workflows" ruxsati
# yo'q), shuning uchun u shu yerda saqlandi. Ko'chirish:
#   cp docs/ci-hardening.yml .github/workflows/ci.yml
# Keyin ushbu izoh qatorlarini o'chirish mumkin. Eslatma: avvalgi taklifdagi
# continue-on-error / || true darvozalari OLIB TASHLANGAN — hammasi bloklovchi.
# ============================================================================

# ============================================================================
# PostAssist V2 — CI (SPRINT 5 hardening, 2026-10).
# ----------------------------------------------------------------------------
# Darvozalar (hech biri "|| true" bilan yashirilmaydi — har biri bloklovchi):
#   1) Lint gate      — ruff check . (ruff.toml) + flake8 E9,F63,F7,F82
#   2) Xavfsizlik     — pip-audit (requirements CVE) + bandit -r telegram_bot -ll
#      (1 va 2 bandida: bash scripts/security_check.sh — serverda ham shu)
#   3) Test suite     — bash tests/run_tests.sh (0 FAIL, exit 0)
# Yagona manba: scripts/security_check.sh (serverda ham xuddi shu qoidalar).
# ============================================================================

name: PostAssist V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_bot/requirements.txt
          pip install -r tests/requirements-test.txt
          pip install ruff==0.6.9 flake8==7.1.1 pip-audit bandit

      # BLOKLOVCHI darvozalar (yagona manba: scripts/security_check.sh):
      #   ruff E9,F63,F7,F82 + flake8 (sintaksis/aniqlanmagan nomlar) ->
      #   ruff check . (to'liq lint) -> pip-audit (CVE) -> bandit -r telegram_bot -ll
      # Istisnosiz: har biri FAIL bo'lsa job qizaradi (exit 1).
      - name: Lint & security gates (blocking)
        run: bash scripts/security_check.sh

      - name: Run Test Suite
        env:
          BOT_TOKEN: "123456789:TEST_MOCK_TOKEN"
          PYTHONPATH: .
        run: |
          bash tests/run_tests.sh
