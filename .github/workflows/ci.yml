name: PostAssist V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f telegram_bot/requirements.txt ]; then pip install -r telegram_bot/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff flake8 pytest pytest-asyncio sentry-sdk

      - name: Lint with Ruff
        continue-on-error: true
        run: |
          ruff check . || true

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/postassist_test
          BOT_TOKEN: "123456789:TEST_MOCK_TOKEN"
          PYTHONPATH: telegram_bot:.
        run: |
          if [ -f telegram_bot/tests/run_tests.sh ]; then
            cd telegram_bot && bash tests/run_tests.sh
          elif [ -f tests/run_tests.sh ]; then
            bash tests/run_tests.sh
          fi
