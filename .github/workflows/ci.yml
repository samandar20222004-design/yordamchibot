name: PostAssist V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: telegram_bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff==0.6.9 flake8==7.1.1 pytest pytest-asyncio sentry-sdk pgserver

      - name: Lint Gate (Syntax & Undefined Names)
        run: |
          ruff check . --output-format=github --select=E9,F63,F7,F82
          flake8 . --count --select=E9,F63,F7,F82 --max-line-length=127 --show-source --statistics

      - name: Full Lint Advisory (Non-blocking)
        continue-on-error: true
        run: |
          ruff check . || true

      - name: Run Test Suite
        env:
          BOT_TOKEN: "123456789:TEST_MOCK_TOKEN"
          PYTHONPATH: .
        run: |
          bash tests/run_tests.sh
