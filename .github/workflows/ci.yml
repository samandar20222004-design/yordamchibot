name: PostAssist V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Qo'lda ishga tushirish (PR ochmasdan branch'ni tekshirish uchun): Actions -> Run workflow.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: telegram_bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff==0.6.9 flake8==7.1.1 pytest pytest-asyncio sentry-sdk pgserver

      - name: Lint Gate (Syntax & Undefined Names)
        run: |
          ruff check . --output-format=github --select=E9,F63,F7,F82
          flake8 . --count --select=E9,F63,F7,F82 --max-line-length=127 --show-source --statistics

      - name: Full Lint Advisory (Non-blocking)
        continue-on-error: true
        run: |
          ruff check . || true

      - name: Run Test Suite
        env:
          BOT_TOKEN: "123456789:TEST_MOCK_TOKEN"
          PYTHONPATH: .
        run: |
          bash tests/run_tests.sh

  # 📱 Mini App frontend: tip tekshiruvi + testlar + production build (mavjud Python job'iga tegmaydi).
  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: miniapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json

      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Frontend tests (vitest)
        run: npm test

      - name: Typecheck + production build (+ dist tekshiruvi)
        run: npm run build

      - name: Dependency audit (advisory, production deps)
        continue-on-error: true
        run: npm audit --omit=dev

  # 🐳 Docker image: FAQAT build va image ichidagi tekshiruvlar (push/deploy YO'Q; bot konteyneri
  # ishga tushirilmaydi — u DB/tokenni talab qiladi).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (push qilinmaydi)
        run: docker build --progress=plain -t postassist:ci .

      - name: Image ichidagi bog'liqliklar (sniffio, httpcore, aiohttp, miniapp_api)
        run: |
          docker run --rm --entrypoint python postassist:ci -c "import sniffio, httpcore, aiohttp, psycopg2, telegram, miniapp_api; print('deps ok, sniffio', sniffio.__file__)"

      - name: tini, curl, non-root, Mini App dist
        run: |
          docker run --rm --entrypoint tini postassist:ci --version
          docker run --rm --entrypoint curl postassist:ci --version | head -n 1
          test "$(docker run --rm --entrypoint id postassist:ci -u)" = "10001"
          docker run --rm --entrypoint test postassist:ci -f /app/miniapp/dist/index.html
          docker run --rm --entrypoint sh postassist:ci -c 'command -v node >/dev/null && { echo "runtime image ichida node bo'"'"'lmasligi kerak"; exit 1; } || echo "node yo'"'"'q (kutilgan)"'

      - name: HEALTHCHECK va ENTRYPOINT/STOPSIGNAL sozlamasi
        run: |
          docker inspect --format '{{json .Config.Healthcheck.Test}}' postassist:ci | tee /dev/stderr | grep -q 'health/live'
          docker inspect --format '{{json .Config.Entrypoint}}' postassist:ci | tee /dev/stderr | grep -q 'tini'
          docker inspect --format '{{.Config.StopSignal}}' postassist:ci | grep -qx 'SIGTERM'

  # PHP versiya (php_bot/): oddiy hosting uchun. PHP 7.4 (hosting) va 8.3 da, haqiqiy MariaDB bilan.
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: pa_test
          MARIADB_USER: pa
          MARIADB_PASSWORD: pa_pass
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: php_bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, json
          coverage: none

      - name: Sintaksis (php -l)
        run: |
          set -e
          for f in $(find . -name '*.php'); do php -l "$f" > /dev/null; done
          echo "php -l: OK"

      - name: Testlar (unit + MariaDB integratsiya)
        env:
          PA_TEST_DB_HOST: 127.0.0.1
        run: php tests/run.php
