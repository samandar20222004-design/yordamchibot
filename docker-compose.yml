# ============================================================
# PostAssist V2 — Docker Compose (10-BOSQICH)
#
# Development:  docker compose up -d          (bot + lokal PostgreSQL)
# Production:   .env da DATABASE_URL Aiven'ga qarasa, bot to'g'ridan-to'g'ri
#               Aiven bilan ishlaydi; lokal postgres xizmati development uchun.
#
# Majburiy env: .env faylini ildizda yarating (namuna: .env.example).
# ============================================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: postassist-bot:latest
    container_name: postassist-bot
    restart: unless-stopped
    # PHASE 12: `docker stop` → SIGTERM → lifecycle drenaji (delivery navbati
    # + scheduler ishlari, standart 15 s). 20 s > 15 s — yarim yo'lda
    # o'chirish yo'q (Dockerfile'dagi STOPSIGNAL SIGTERM bilan bir xil).
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      # .env da DATABASE_URL berilmagan bo'lsa — development rejimida
      # mahalliy PostgreSQL'ga ulanadi.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postassist:postassist@postgres:5432/postassist}
      PORT: ${PORT:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Dockerfile'dagi HEALTHCHECK bilan bir xil mantiq: UNHEALTHY bo'lsa
      # konteyner nosog'lom. DEGRADED/HEALTHY — sog'lom.
      test:
        - CMD
        - python
        - -c
        - "from services.health_service import get_system_health; import asyncio; res=asyncio.run(get_system_health()); exit(0 if res.get('status')!='UNHEALTHY' else 1)"
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - postassist
    volumes:
      # sent-journal (post idempotentlik jurnali) konteyner restartlarida
      # saqlanib qolishi uchun doimiy disk.
      - bot_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: postassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postassist
      POSTGRES_PASSWORD: postassist
      POSTGRES_DB: postassist
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postassist -d postassist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Development uchun port lokal mashinaga ochiladi; production'da
    # rules'ni olib tashlash yoki faqat ichki tarmoqqa qoldirish mumkin.
    ports:
      - "5432:5432"
    networks:
      - postassist

  # PHASE 2 · ixtiyoriy REDIS (distributed state / rate limiting).
  # O'chirilgan (opt-in):  docker compose --profile redis up -d
  # So'nra .env da:  REDIS_URL=redis://redis:6379/0
  # Bot Redis'siz ham TO'LIQ ishlaydi — state faqat In-Memory'da qoladi
  # (services/cache_backend.py: circuit breaker bilan avtomatik fallback).
  redis:
    image: redis:7-alpine
    container_name: postassist-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - postassist

volumes:
  pg_data:
  bot_data:

networks:
  postassist:
    driver: bridge
